<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1150" viewBox="0 0 1400 1150"><rect width="1400" height="1150" fill="#fcfcf7"/><style>text{font-family:Microsoft YaHei,sans-serif;fill:#525b43}</style><text x="45" y="50" font-size="26">技术路径</text><text x="45" y="80" font-size="13" fill="#999">依据目录归纳，补充项为制作与验证建议</text><rect x="40" y="530" width="220" height="85" rx="14" fill="#778765"/><text x="65" y="566" style="fill:white" font-size="23">技术路径</text><text x="65" y="594" style="fill:white" font-size="12">素材 → 镜头 → 视听 → 迭代</text><path d="M260 572 H300 V162 H340" fill="none" stroke="#c6cfb9" stroke-width="2"/><rect x="340" y="125" width="200" height="75" rx="10" fill="#e5eddc"/><text x="356" y="156" font-size="21">01 人物素材</text><text x="356" y="181" font-size="12">角色设定 → 可复用资产</text><path d="M540 162 H565 V122 H590" fill="none" stroke="#d5dccb"/><text x="605" y="127" font-size="16">直出法｜简要设定 / 细化设定</text><path d="M540 162 H565 V149 H590" fill="none" stroke="#d5dccb"/><text x="605" y="154" font-size="16">2D 转 3D｜底图质量与视角覆盖</text><path d="M540 162 H565 V176 H590" fill="none" stroke="#d5dccb"/><text x="605" y="181" font-size="16">精度控制｜轮廓、五官、服饰细节</text><path d="M540 162 H565 V203 H590" fill="none" stroke="#d5dccb"/><text x="605" y="208" font-size="16">白底特写 + 三视图｜统一比例与造型</text><path d="M540 162 H565 V230 H590" fill="none" stroke="#d5dccb"/><text x="605" y="235" font-size="16">角色卡｜身份、外形、行为与禁改项</text><path d="M260 572 H300 V332 H340" fill="none" stroke="#c6cfb9" stroke-width="2"/><rect x="340" y="295" width="200" height="75" rx="10" fill="#ede6d9"/><text x="356" y="326" font-size="21">02 场景素材</text><text x="356" y="351" font-size="12">空间关系 → 场景一致性</text><path d="M540 332 H565 V292 H590" fill="none" stroke="#d5dccb"/><text x="605" y="297" font-size="16">场景设定｜时代、地点、尺度与氛围</text><path d="M540 332 H565 V319 H590" fill="none" stroke="#d5dccb"/><text x="605" y="324" font-size="16">空间锚点｜入口、窗、主光源与家具</text><path d="M540 332 H565 V346 H590" fill="none" stroke="#d5dccb"/><text x="605" y="351" font-size="16">机位参考｜全景 / 中景 / 局部细节</text><path d="M540 332 H565 V373 H590" fill="none" stroke="#d5dccb"/><text x="605" y="378" font-size="16">角色站位｜朝向、距离与视线关系</text><path d="M260 572 H300 V502 H340" fill="none" stroke="#c6cfb9" stroke-width="2"/><rect x="340" y="465" width="200" height="75" rx="10" fill="#e0e9e8"/><text x="356" y="496" font-size="21">03 镜头生成</text><text x="356" y="521" font-size="12">动作拆解 → 镜头表达</text><path d="M540 502 H565 V462 H590" fill="none" stroke="#d5dccb"/><text x="605" y="467" font-size="16">文生视频｜主体、动作、场景、时长</text><path d="M540 502 H565 V489 H590" fill="none" stroke="#d5dccb"/><text x="605" y="494" font-size="16">图像参考｜角色与场景的视觉锚点</text><path d="M540 502 H565 V516 H590" fill="none" stroke="#d5dccb"/><text x="605" y="521" font-size="16">运镜｜景别、视角、运动与速度</text><path d="M540 502 H565 V543 H590" fill="none" stroke="#d5dccb"/><text x="605" y="548" font-size="16">连续性｜人物、道具、方向与前后镜头</text><path d="M260 572 H300 V672 H340" fill="none" stroke="#c6cfb9" stroke-width="2"/><rect x="340" y="635" width="200" height="75" rx="10" fill="#f1e6d7"/><text x="356" y="666" font-size="21">04 光影与色彩</text><text x="356" y="691" font-size="12">光源逻辑 → 情绪基调</text><path d="M540 672 H565 V632 H590" fill="none" stroke="#d5dccb"/><text x="605" y="637" font-size="16">室内午后｜温暖柔光与方向性</text><path d="M540 672 H565 V659 H590" fill="none" stroke="#d5dccb"/><text x="605" y="664" font-size="16">室内白天｜自然光、曝光与层次</text><path d="M540 672 H565 V686 H590" fill="none" stroke="#d5dccb"/><text x="605" y="691" font-size="16">室内夜晚｜实景光源与冷暖对比</text><path d="M540 672 H565 V713 H590" fill="none" stroke="#d5dccb"/><text x="605" y="718" font-size="16">室外日间｜时间、天气与阴影方向</text><path d="M540 672 H565 V740 H590" fill="none" stroke="#d5dccb"/><text x="605" y="745" font-size="16">色卡｜主色、辅色、肤色与跨镜头统一</text><path d="M260 572 H300 V842 H340" fill="none" stroke="#c6cfb9" stroke-width="2"/><rect x="340" y="805" width="200" height="75" rx="10" fill="#e9e4ee"/><text x="356" y="836" font-size="21">05 声音与剪辑</text><text x="356" y="861" font-size="12">节奏组织 → 视听衔接</text><path d="M540 842 H565 V802 H590" fill="none" stroke="#d5dccb"/><text x="605" y="807" font-size="16">声音分层｜组合音效 / 拟声 / 氛围</text><path d="M540 842 H565 V829 H590" fill="none" stroke="#d5dccb"/><text x="605" y="834" font-size="16">BGM 衔接｜入点、出点与音量关系</text><path d="M540 842 H565 V856 H590" fill="none" stroke="#d5dccb"/><text x="605" y="861" font-size="16">台词配音｜语气、停顿与情绪节奏</text><path d="M540 842 H565 V883 H590" fill="none" stroke="#d5dccb"/><text x="605" y="888" font-size="16">剪辑｜动作点、镜头长度与情绪推进</text><path d="M540 842 H565 V910 H590" fill="none" stroke="#d5dccb"/><text x="605" y="915" font-size="16">活人感｜微表情、呼吸与自然反应</text><path d="M260 572 H300 V1012 H340" fill="none" stroke="#c6cfb9" stroke-width="2"/><rect x="340" y="975" width="200" height="75" rx="10" fill="#e9ebdc"/><text x="356" y="1006" font-size="21">06 检查与迭代</text><text x="356" y="1031" font-size="12">定位问题 → 单项验证</text><path d="M540 1012 H565 V972 H590" fill="none" stroke="#d5dccb"/><text x="605" y="977" font-size="16">修改路径｜提示词 / 剪辑 / 局部修图</text><path d="M540 1012 H565 V999 H590" fill="none" stroke="#d5dccb"/><text x="605" y="1004" font-size="16">检查维度｜结构、动作、站位与光影</text><path d="M540 1012 H565 V1026 H590" fill="none" stroke="#d5dccb"/><text x="605" y="1031" font-size="16">对照方法｜固定条件，逐项调整</text><path d="M540 1012 H565 V1053 H590" fill="none" stroke="#d5dccb"/><text x="605" y="1058" font-size="16">记录｜输入、版本、结果与待解决问题</text></svg>